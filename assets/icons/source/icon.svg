<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- WebSpace icon: a TV whose screen shows storage bars. Original artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3f8f"/>
      <stop offset="1" stop-color="#141b3d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a5e"/>
      <stop offset="1" stop-color="#101833"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb2f5"/>
      <stop offset="1" stop-color="#7fdcff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ffc56b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- the TV -->
  <rect x="72" y="110" width="368" height="244" rx="26" fill="#0b1027"/>
  <rect x="90" y="128" width="332" height="208" rx="14" fill="url(#screen)"/>
  <path d="M 206 354 L 196 396 L 316 396 L 306 354 Z" fill="#0b1027"/>
  <rect x="160" y="392" width="192" height="18" rx="9" fill="#0b1027"/>
  <!-- storage bars: install (cyan) and data (orange) -->
  <g>
    <rect x="118" y="158" width="276" height="30" rx="15" fill="#0b1027"/>
    <rect x="118" y="158" width="150" height="30" rx="15" fill="url(#cyan)"/>
    <rect x="252" y="158" width="96" height="30" rx="0" fill="url(#orange)"/>
    <rect x="334" y="158" width="28" height="30" rx="14" fill="url(#orange)"/>
    <rect x="118" y="216" width="276" height="30" rx="15" fill="#0b1027"/>
    <rect x="118" y="216" width="104" height="30" rx="15" fill="url(#cyan)"/>
    <rect x="206" y="216" width="40" height="30" rx="15" fill="url(#orange)"/>
    <rect x="118" y="274" width="276" height="30" rx="15" fill="#0b1027"/>
    <rect x="118" y="274" width="58" height="30" rx="15" fill="url(#cyan)"/>
  </g>
  <!-- a soft shine on the screen -->
  <path d="M 90 142 Q 90 128 104 128 L 300 128 L 210 336 L 104 336 Q 90 336 90 322 Z" fill="#ffffff" opacity="0.05"/>
</svg>
